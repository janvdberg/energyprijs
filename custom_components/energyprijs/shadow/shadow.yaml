# ═══════════════════════════════════════════════════════════════════════
#  energyprijs_shadow.yaml — SHADOW-MODE accu-handel (regime-vrije regel)
#  Draait LOAST de bestaande G1–G4-logica; schrijft NOOIT naar de omvormer.
#  Berekent per kwartier: doel-SOC, ruimtetak R, V, herlaadkosten, verkoop-eis
#  en een SHADOW-status in de vijf bandennamen (Laden/Spaar/
#  Neutraal/Doorleveren/Ontladen), gelijk aan accu_statusnamen.md. Log per beslissing via notify- of logboekregel.
#
#  Installatie: plaats dit bestand in /config/packages/ EN herstart HA.
#  Bron: roi-monitor/stroomhandel_tactiek.md (revisie 3, okt '26).
# ═══════════════════════════════════════════════════════════════════════

input_number:
  # ── modelconstanten (instelbaar zonder code) ──
  #    OPLET: geen 'initial' hier — initial zet bij ELKE HA-herstart de
  #    tactiekwaarde terug over eigen instellingen heen. De installer zet deze
  #    startwaarden éénmalig via HELPERS_DEFAULTS (IsDone-bewakend), exact zoals
  #    het hoofdpackage dat doet (zie package.yaml r.385).
  # v1.5.5: shadow_eta is DE NOODVALLET en moet CONSISTENT blijven met de
  # gemeten roundtrip: η = (77+90)/200 = 0,835 per been; voor een heen-en-weer
  # transactie geldt rt = 0,77×0,90 ≈ 0,70 (veld rendement_roundtrip_pct).
  # Vroeger stond hier 0,83 (vóór-meting-aanname); bij het uitzetten van de
  # meet-helpers mag de solver niet terugvallen op een optimistischer getal
  # dan zijn eigen hoofdroute. Zolang de helpers bestaan wordt deze niet
  # gebruikt; hij telt pas als de rendements-helpers unavailable zijn.
  shadow_eta:
    name: "Shadow η — noodvallet rendement (×)"
    min: 0.50
    max: 1.00
    step: 0.01
    unit_of_measurement: "×"
    icon: mdi:lightning-bolt
  shadow_w:
    name: "Shadow w — slijtage €/kWh"
    min: 0.00
    max: 0.10
    step: 0.005
    unit_of_measurement: "€/kWh"
    icon: mdi:tune
  shadow_m:
    name: "Shadow m — marge €/kWh"
    min: 0.00
    max: 0.10
    step: 0.005
    unit_of_measurement: "€/kWh"
    icon: mdi:percent
  shadow_n_top:
    name: "Shadow N — aantal dure kwartieren voor V"
    min: 4
    max: 96
    step: 1
    icon: mdi:counter
  shadow_capaciteit:
    name: "Shadow C — batterijcapaciteit bruikbaar"
    min: 10
    max: 150
    step: 1
    unit_of_measurement: "kWh"
    icon: mdi:battery-high
  shadow_soc_min:
    name: "Shadow SOC-ondergrens (huisreserve)"
    min: 0
    max: 50
    step: 1
    unit_of_measurement: "%"
    icon: mdi:battery-low
  # R2-hold voor de Laden-tak: prev 'Laden' houdt zolang c < V+H én de
  # verwachte SOC-stijging onder deze grens blijft (%). 2% is een gok en dus
  # instelbaar.
  shadow_laden_hold_r2:
    name: "Shadow laad-hold — maximale verwachte SOC-stijging (%)"
    min: 0
    max: 10
    step: 0.5
    unit_of_measurement: "%"
    icon: mdi:battery-arrow-down
  shadow_hysteresis:
    name: "Shadow hysteresis — band aan de prijsgrens (€/kWh)"
    min: 0
    max: 0.05
    step: 0.001
    unit_of_measurement: "€/kWh"
    mode: box
    icon: mdi:wave-sine
  # v1.9.5: ondergrens van de verkoop-eis. Zonder heffing over de volledige
  # verkoopsom is de eis ~0,08 €/kWh en wint élke euro boven die drempel —
  # dan verkoopt de keten uit de reserve terwijl laden in het dal véél
  # goedkoper was geweest. De eis mag nooit lager dan dit floor.
  shadow_verkoop_eis_min:
    name: "Shadow verkoop-eis-ondergrens (€/kWh)"
    min: 0
    max: 0.50
    step: 0.01
    unit_of_measurement: "€/kWh"
    mode: box
    icon: mdi:sell
    unit_of_measurement: "€/kWh"
    icon: mdi:shield-half-full

input_text:
  # v1.7.4: hernoemd van shadow_vorige_status (de entiteit 'shadow_vorige_status'
  # raakte onleesbaar nadat COMFORT → Ontladen ging); de installer migreert de
  # waarde eenmalig.
  shadow_status_vorige:
    name: "Shadow voorafgaande status (hysterese)"
    mode: text
    max: 32
    icon: mdi:history

template:
  # ─────────────────────────────────────────────────────────────────────
  #  Eén triggers-blok voor ALLE shadow-sensoren: herbereken zodra de
  #  dagprijs-list vers is, helpers veranderen, SOC beweegt of de zon-
  #  sensoren bijwerken. De daglijst-kwartier-cyclus (time_pattern /5 in
  #  het package) drijft de shadow mee via sensor.stroomprijs_daglijst —
  #  een eigen time_pattern hier zou de beslissings-log elke 5 min
  #  herschrijven (P2-review 19 okt: onnodige log-bloat).
  # ─────────────────────────────────────────────────────────────────────
  - triggers:
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id:
          - input_number.shadow_eta
          - input_number.rendement_laad_pct
          - input_number.rendement_ontlaad_pct
          - input_number.rendement_roundtrip_pct
          - input_number.prijs_opslag_tijdsafhankelijk
          - input_number.prijs_dal_uren
          - input_number.prijs_top_uren
          - input_number.shadow_w
          - input_number.shadow_m
          - input_number.shadow_n_top
          - input_number.shadow_capaciteit
          - input_number.accu_reserve_pct
          - input_number.accu_vermogen_uit_kw
          - sensor.prijs_top_uren
          - input_number.shadow_hysteresis
          - input_number.shadow_verkoop_eis_min
          - input_boolean.prijs_saldering_energiebelasting_teruggave
          - sensor.stroomprijs_daglijst
          - input_text.shadow_status_vorige
          - sensor.vandaag_verwachte_zonnestroom
          - sensor.verwachte_opbrengst_morgen
          - sensor.accu_percentage
          # v1.9.0: de accu-blokkade is een eigen signaal; de status-sensor
          # spiegelt hem in de attributen, dus herbereken ook op zijn verandering.
          - binary_sensor.shadow_accu_blokkade
          - sun.sun
    sensor:
      # ═══ STAP 1 — doel-SOC uit verwachte zonnestroom ═══
      - name: "Shadow doel-SOC"
        unique_id: shadow_doel_soc
        unit_of_measurement: "%"
        state_class: measurement
        availability: >
          {{ states('input_number.shadow_capaciteit') | float(0) > 0
             and (has_value('sensor.vandaag_verwachte_zonnestroom')
                  or has_value('sensor.verwachte_opbrengst_morgen')) }}
        state: >
          {% set S = (states('sensor.vandaag_verwachte_zonnestroom') | float(0)
                      + states('sensor.verwachte_opbrengst_morgen') | float(0)) %}
          {% set C = states('input_number.shadow_capaciteit') | float(92) %}
          {% set grens = states('input_number.accu_reserve_pct') | float(20) %}
          {% set raw = 100 - (S / C * 100) %}
          {{ ([grens, [100, raw] | min] | max) | round(1) }}

      # ═══ STAP 3 — waarde van een kWh in de batterij (V) ═══
      - name: "Shadow V — waarde opgeslagen kWh"
        unique_id: shadow_v_waarde_opgeslagen_kwh
        unit_of_measurement: "€/kWh"
        state_class: measurement
        availability: >
          {{ states('sensor.stroomprijs_daglijst') not in ['unknown','unavailable']
             and (state_attr('sensor.stroomprijs_daglijst', 'vandaag') | default([], true) | length) > 0 }}
        state: >
          {#── rendement-contract (v1.5.5): η uit de GEMETEN helpers (installer HELPERS_DEFAULTS), niet meer los getypt ─#}
          {# availability via has_value: float()-fallback's vullen anders altijd 77/90 #}
          {% set rend_ok = has_value('input_number.rendement_laad_pct') and has_value('input_number.rendement_ontlaad_pct') %}
          {# v1.6.2: V-grens op η_rt = η_laad × η_ontlaad (hele roundtrip); de oude η_gem (gemiddelde per been) lag ~17% te laag #}
          {% set eta_rt = ((states('input_number.rendement_laad_pct') | float(77) * states('input_number.rendement_ontlaad_pct') | float(90)) / 10000) if rend_ok else states('input_number.shadow_eta') | float(0.83) %}
          {% set n = states('input_number.shadow_n_top') | int(12) %}
          {% set nu_epoch = now() | as_timestamp | round(0) | int %}
          {% set ns = namespace(prijzen=[]) %}
          {% for e in state_attr('sensor.stroomprijs_daglijst', 'vandaag') | default([], true) %}
            {% if e.e is defined and e.in is defined and e.e >= nu_epoch %}
              {% set ns.prijzen = ns.prijzen + [e.in | float(-1)] %}
            {% endif %}
          {% endfor %}
          {% for e in state_attr('sensor.stroomprijs_daglijst', 'morgen') | default([], true) %}
            {% if e.e is defined and e.in is defined %}
              {% set ns.prijzen = ns.prijzen + [e.in | float(-1)] %}
            {% endif %}
          {% endfor %}
          {% set gesorteerd = (ns.prijzen | sort(reverse=true))[:n] %}
          {% set top = namespace(som=0.0, aantal=0) %}
          {% for pr in gesorteerd %}
            {% if top.aantal < n %}{% set top.som = top.som + pr %}{% set top.aantal = top.aantal + 1 %}{% endif %}
          {% endfor %}
          {% if top.aantal == 0 %}unavailable{% else %}
            {{ (eta_rt * (top.som / top.aantal)) | round(4) }}
          {% endif %}

      # ═══ STAP 6 — herlaadkosten over venster t+24u (net vs PV) ═══
      - name: "Shadow herlaadkosten"
        unique_id: shadow_herlaadkosten
        unit_of_measurement: "€/kWh"
        state_class: measurement
        availability: >
          {{ has_value('sensor.stroomprijs_daglijst')
             and (state_attr('sensor.stroomprijs_daglijst', 'vandaag') | default([], true) | length) > 0 }}
        state: >
          {% set S = (states('sensor.vandaag_verwachte_zonnestroom') | float(0)
                      + states('sensor.verwachte_opbrengst_morgen') | float(0)) %}
          {% set ns = namespace(net=[], pv=[], nu=now()) %}
          {#── zonvenster: boven horizon → start is 'al begonnen' (use now); onder horizon → start = next_rising ──#}
          {% set son_raw = state_attr('sun.sun', 'next_setting') %}
          {% set op_raw = state_attr('sun.sun', 'next_rising') %}
          {% set son = son_raw | as_datetime if son_raw else none %}
          {% set op = op_raw | as_datetime if op_raw else none %}
          {% if states('sun.sun') == 'above_horizon' and son is not none %}{% set op = now() %}{% endif %}
          {% for e in state_attr('sensor.stroomprijs_daglijst', 'vandaag') | default([], true) %}
            {% if e.t is defined and e.in is defined %}
              {% set ts = e.t | as_datetime %}
              {% if ts >= ns.nu and ts <= ns.nu + timedelta(hours=24) %}
                {% set ns.net = ns.net + [e.in | float(9)] %}
                {#── PV-herlaad alleen binnen het zonvenster (sun.sun) ──#}
                {% if e.uit is defined and son is not none and op is not none and ts >= op and ts <= son %}
                  {% set ns.pv = ns.pv + [e.uit | float(9)] %}
                {% endif %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {% for e in state_attr('sensor.stroomprijs_daglijst', 'morgen') | default([], true) %}
            {% if e.t is defined and e.in is defined %}
              {% set ts = e.t | as_datetime %}
              {% if ts >= ns.nu and ts <= ns.nu + timedelta(hours=24) %}
                {% set ns.net = ns.net + [e.in | float(9)] %}
                {#── PV-herlaad alleen binnen het zonvenster (sun.sun) ──#}
                {% if e.uit is defined and son is not none and op is not none and ts >= op and ts <= son %}
                  {% set ns.pv = ns.pv + [e.uit | float(9)] %}
                {% endif %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {% set net_min = ns.net | min if ns.net | length > 0 else none %}
          {% set pv_min = ns.pv | min if ns.pv | length > 0 else none %}
          {% if net_min is none and pv_min is none %}unavailable
          {% elif net_min is none %}{{ (pv_min) | round(4) }}
          {% elif pv_min is none %}{{ (net_min) | round(4) }}
          {% else %}{{ ([net_min, pv_min] | min) | round(4) }}
          {% endif %}

      # ═══ STAP 6 — verkoop-eis ═══
      # ═══ STAP 6a — herlaadkosten NET: goedkoopste in-prijs over de hele
      # beschikbare horizon (vandaag-restant + morgen), volume = tot de reserve.
      - name: "Shadow herlaadkosten net"
        unique_id: shadow_herlaadkosten_net
        unit_of_measurement: "€/kWh"
        state_class: measurement
        availability: >
          {{ has_value('sensor.stroomprijs_daglijst')
             and (state_attr('sensor.stroomprijs_daglijst', 'vandaag') | default([], true) | length) > 0 }}
        state: >
          {% set ns = namespace(net=[], nu=now()) %}
          {% for dag in ['vandaag', 'morgen'] %}
            {% for e in state_attr('sensor.stroomprijs_daglijst', dag) | default([], true) %}
              {% if e.t is defined and e.in is defined %}
                {% set ts = e.t | as_datetime %}
                {% if ts >= ns.nu and ts <= ns.nu + timedelta(hours=48) %}
                  {% set ns.net = ns.net + [e.in | float(9)] %}
                {% endif %}
              {% endif %}
            {% endfor %}
          {% endfor %}
          {% if ns.net | length == 0 %}unavailable
          {% else %}{{ (ns.net | min) | round(4) }}
          {% endif %}

      # ═══ STAP 6b — herlaadkosten ZON: goedkoopste PV-prijs (uit) in het
      # zonvenster, volume alleen het stuk boven doel-SOC = max(R,0)/100 × C.
      - name: "Shadow herlaadkosten zon"
        unique_id: shadow_herlaadkosten_zon
        unit_of_measurement: "€/kWh"
        state_class: measurement
        availability: >
          {{ has_value('sensor.stroomprijs_daglijst')
             and (state_attr('sensor.stroomprijs_daglijst', 'vandaag') | default([], true) | length) > 0 }}
        state: >
          {% set ns = namespace(pv=[], nu=now()) %}
          {% set son_raw = state_attr('sun.sun', 'next_setting') %}
          {% set op_raw = state_attr('sun.sun', 'next_rising') %}
          {% set son = son_raw | as_datetime if son_raw else none %}
          {% set op = op_raw | as_datetime if op_raw else none %}
          {% if states('sun.sun') == 'above_horizon' and son is not none %}{% set op = now() %}{% endif %}
          {% if son is none or op is none %}unavailable
          {% else %}
            {% for dag in ['vandaag', 'morgen'] %}
              {% for e in state_attr('sensor.stroomprijs_daglijst', dag) | default([], true) %}
                {% if e.t is defined and e.uit is defined %}
                  {% set ts = e.t | as_datetime %}
                  {% if ts >= ns.nu and ts <= ns.nu + timedelta(hours=48) and ts >= op and ts <= son %}
                    {% set ns.pv = ns.pv + [e.uit | float(9)] %}
                  {% endif %}
                {% endif %}
              {% endfor %}
            {% endfor %}
            {% if ns.pv | length == 0 %}unavailable
            {% else %}{{ (ns.pv | min) | round(4) }}
            {% endif %}
          {% endif %}

      - name: "Shadow verkoop-eis net"
        unique_id: shadow_verkoop_eis_net
        unit_of_measurement: "€/kWh"
        state_class: measurement
        availability: >
          {{ has_value('sensor.stroomprijs_daglijst')
             and has_value('sensor.shadow_herlaadkosten_net') }}
        state: >
          {#── rendement-contract (v1.5.5): η uit de GEMETEN helpers (installer HELPERS_DEFAULTS), niet meer los getypt ─#}
          {# availability via has_value: float()-fallback's vullen anders altijd 77/90 #}
          {% set rend_ok = has_value('input_number.rendement_laad_pct') and has_value('input_number.rendement_ontlaad_pct') %}
          {# Formule conform stroomhandel_tactiek.md STAP 6 (regime-vrije regel,
             revisie 3): uit(t)·η_rt > h + w + m  ⇔  eis = (h + w + m)/η_rt.
             η_rt = product van de GEMETEN helpers (installer HELPERS_DEFAULTS,
             fallback shadow_eta). Let op: vóór deze wijziging stond hier de
             hybride vorm h/η + w + m — alleen h gedeeld door η, slijtage op
             kale voet. Met η_rt < 1 was die eis te hoog (~0,51 bij gemeten
             rendemen) en stierf de verkooptak in tests én productie. #}
          {% set eta = ((states('input_number.rendement_laad_pct') | float(77) * states('input_number.rendement_ontlaad_pct') | float(90)) / 10000) if rend_ok else states('input_number.shadow_eta') | float(0.83) %}
          {% set w = states('input_number.shadow_w') | float(0.025) %}
          {% set m = states('input_number.shadow_m') | float(0.015) %}
          {% set h = states('sensor.shadow_herlaadkosten_net') | float(9) %}
          {# v1.9.5: ondergrens op de eis (shadow_verkoop_eis_min) — zie kop. #}
          {% set vloer = states('input_number.shadow_verkoop_eis_min') | float(0.20) %}
          {{ ([vloer, (h + w + m) / eta] | max) | round(4) }}

      # ═══ STAP 6b — verkoop-eis ZON (herladen uit de zon, volume boven doel-SOC) ═══
      - name: "Shadow verkoop-eis zon"
        unique_id: shadow_verkoop_eis_zon
        unit_of_measurement: "€/kWh"
        state_class: measurement
        availability: >
          {{ has_value('sensor.stroomprijs_daglijst')
             and has_value('sensor.shadow_herlaadkosten_zon') }}
        state: >
          {% set rend_ok = has_value('input_number.rendement_laad_pct') and has_value('input_number.rendement_ontlaad_pct') %}
          {% set eta = ((states('input_number.rendement_laad_pct') | float(77) * states('input_number.rendement_ontlaad_pct') | float(90)) / 10000) if rend_ok else states('input_number.shadow_eta') | float(0.83) %}
          {% set w = states('input_number.shadow_w') | float(0.025) %}
          {% set m = states('input_number.shadow_m') | float(0.015) %}
          {% set h = states('sensor.shadow_herlaadkosten_zon') | float(9) %}
          {# v1.9.5: ondergrens op de eis (shadow_verkoop_eis_min) — zie kop. #}
          {% set vloer = states('input_number.shadow_verkoop_eis_min') | float(0.20) %}
          {{ ([vloer, (h + w + m) / eta] | max) | round(4) }}

      # ═══ RUIMTE — R = SOC − doel-SOC (positief = te vol voor aankomende zon) ═══
      - name: "Shadow ruimtegebrek R"
        unique_id: shadow_ruimtegebrek_r
        unit_of_measurement: "%"
        state_class: measurement
        availability: >
          {{ has_value('sensor.accu_percentage') and has_value('sensor.shadow_doel_soc') }}
        state: >
          {% set soc = states('sensor.accu_percentage') | float(0) %}
          {% set doel = states('sensor.shadow_doel_soc') | float(100) %}
          {{ (soc - doel) | round(1) }}

      # ═══ BESLISSING — vijf statussen, laag → hoog in prijs ═══
      #   Laden        net goedkoop genoeg om te laden (c = in+w+m < V−H) én de
      #                  verwachte zon vult de accu niet vanzelf (R2 < 0).
      #   Spaar        net goedkoop genoeg om te gebruiken (in < V+H), maar
      #                  laden vuurt niet; de accu blijft staan.
      #   Neutraal     in ≥ V+H: de accu voedt het huis, er wordt niets verkocht.
      #   Doorleveren  zon boven horizon, de prijs is te laag om te verkopen en
      #                  de accu kan de opwek niet kwijt (R2 > 0 of SOC = 100%):
      #                  de zon gaat naar het net, de accu blijft staan.
      #   Ontladen     verkopen uit de accu in de duurste uren; bij zon toetst
      #                  de eis voor het zonvolume (boven doel-SOC), 's nachts
      #                  voor het netvolume (vullen tot de reserve).
      #   Er is géén PV-overschot-sensor en géén zesde status: een negatieve
      #   uit-prijs is per definitie onder elke verkoop-eis, dus de accu blijft
      #   staan — bij zon als Doorleveren, anders als Spaar.
      - name: "Shadow status"
        unique_id: shadow_status
        icon: mdi:content-save-settings-outline
        availability: >
          {{ states('sensor.stroomprijs_daglijst') not in ['unknown','unavailable']
             and (state_attr('sensor.stroomprijs_daglijst', 'vandaag') | default([], true) | length) > 0 }}
        state: >
          {#── rendement-contract (v1.5.5): η uit de GEMETEN helpers (installer HELPERS_DEFAULTS), niet meer los getypt ─#}
          {# availability via has_value: float()-fallback's vullen anders altijd 77/90 #}
          {% set rend_ok = has_value('input_number.rendement_laad_pct') and has_value('input_number.rendement_ontlaad_pct') %}
          {% set eta = ((states('input_number.rendement_laad_pct') | float(77) * states('input_number.rendement_ontlaad_pct') | float(90)) / 10000) if rend_ok else states('input_number.shadow_eta') | float(0.83) %}
          {% set w = states('input_number.shadow_w') | float(0.025) %}
          {% set m = states('input_number.shadow_m') | float(0.015) %}
          {% set V = states('sensor.shadow_v_waarde_opgeslagen_kwh') | float(0) %}
          {# v1.9.0: prijsladder — shadow_status is een ZUIVERE prijs-/
             economiestatus, onafhankelijk van de SOC (behalve Doorleveren,
             dat hangt aan R en dus aan de zon). De SOC-reserve (flor) is uit
             de statuskeuze gehaald en leeft alleen nog in
             binary_sensor.shadow_accu_blokkade. Formules (V, v_eis,
             herlaadkosten, w, m, H, eta, doel-SOC, R) zijn NIET veranderd. #}
          {% set R2 = states('sensor.shadow_ruimtegebrek_r') | float(0) %}
          {% set v_eis_net = states('sensor.shadow_verkoop_eis_net') | float(9) %}
          {% set v_eis_zon = states('sensor.shadow_verkoop_eis_zon') | float(v_eis_net) %}
          {% set R2H = states('input_number.shadow_laden_hold_r2') | float(2) %}
          {# HUIDIGE KWARTIERPRIJS v1.5.2: nu = laatste entry met t <= nu. #}
          {# v1.7.8: bevroren daglijst-check — laatste verstreken kwartier
             ouder dan 45 min → geen beslissing → 'unavailable' (fail-safe). #}
          {% set nu_epoch = now() | as_timestamp | round(0) | int %}
          {% set nu2 = namespace(in_nu=none, uit_nu=none, t_nu=none) %}
          {% for e in state_attr('sensor.stroomprijs_daglijst', 'vandaag') | default([], true) %}
            {% if e.e is defined and e.in is defined %}
              {% if e.e <= nu_epoch and (nu2.t_nu is none or e.e > nu2.t_nu) %}
                {% set nu2.in_nu = e.in | float(none) %}
                {% set nu2.uit_nu = e.uit | float(none) %}
                {% set nu2.t_nu = e.e %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {% set prev = states('input_text.shadow_status_vorige') | default('', true) | string %}
          {% set H = states('input_number.shadow_hysteresis') | float(0.005) %}
          {# v1.9.2 — RESERVE-AWARE ONTLAADPLANNING. De vraag is niet meer
             "is nú duur genoeg?" maar "zit dit uur in de TOP van de uren die
             er nog uit mogen?". Hoeveel energie er tot de reserve mag:
             kwh_nog = (SOC − flor)/100 × capaciteit × rendement_ontlaad.
             Dat budget omrekenen naar beschikbare uren: n_top = afgerond
             kwh_nog / (vermogen × η_uit per uur). Daarna de top-verkiezing:
             de n_top duurste kwartierslots (vandaag + morgen, boven de
             verkoop-eis, inclusief het lopende slot) vormen de toegelaten
             ontlaaduren. Ontladen kan alleen als het HUIDIGE kwartier in die
             top staat; de statusketen gaat eerst door Laden-hold en
             Doorleveren, en de harde reserve-blokkade leeft in
             binary_sensor.shadow_accu_blokkade. Zonder prijsschema of vermogen (n_top = 0) valt de
             regel terug op puur-koopjes — fail-safe oud gedrag. #}
          {% set soc_raw = states('sensor.accu_percentage') %}
          {% set soc_num = soc_raw | float(-1) %}
          {% set soc_ok = soc_raw not in ['unknown', 'unavailable'] and soc_num >= 0 %}
          {% set nu_epoch = now() | as_timestamp | round(0) | int %}
          {# v1.9.2: de ENIGE reserve die ertoe doet is input_number.accu_reserve_pct
             (Deye-ondergrens-SOC van het dashboard) — v1.9.7: alle flor-takken lezen deze helper
             v1.9.2 let op: float() van 'unknown'/'unavailable' geeft GEEN default —
             die moet expliciet, anders wordt η_uit/vermogen 0 → budgetloos. #}
          {% set flor = states('input_number.accu_reserve_pct') | float(20) %}
          {% set in_reserve = soc_ok and soc_num <= flor %}
          {% set C = states('input_number.shadow_capaciteit') | float(92) %}
          {% set eta_u = (states('input_number.rendement_ontlaad_pct') | float(90) if has_value('input_number.rendement_ontlaad_pct') else 90.0) / 100 %}
          {% set P = states('input_number.accu_vermogen_uit_kw') | float(5) if has_value('input_number.accu_vermogen_uit_kw') else 5.0 %}
          {# soc_num is AL een float (float(-1)); 'is defined' was altijd true —
             bij unknown/unavailable SOC anders 0 kWh budget (fail-safe). #}
          {# v1.9.2: de 100%→0%-kWh-schaal van Deye is ROUW (verlies-vrij);
             het ontladen verlies zit al in eta_u hieronder. Daarom SOC × C,
             zónder η, als uitgangspunt — anders wordt het budget dubbel
             gekort en valt de top-verkiezing kunstmatig weg. #}
          {% set kwh_nog = [((soc_num - flor) / 100 * C), 0] | max if soc_ok else 0 %}
          {# Floor (geen round): afronden naar dichtstbijzijnd kan een uur te
             veel toestaan → SOC zakt onder de reserve. Veilig naar beneden. #}
          {# Bovenkant: nooit méér dure slots verkiezen dan het aantal dat
             voor de gemiddelde-prijs V wordt bekeken (shadow_n_top). Meer
             kandidaten dan de V-basis verandert de beslisketting niet. #}
          {# v1.9.2 correctie: het BUDGET (ontlaadbare_uren) mag nooit lager
             worden afgekapt dan shadow_n_top — de statussensor beslist op de
             budgetregel (n_top), de attribute 'ontlaadbare_uren' is puur
             informatief en toont het ruwe budget. Zonder deze splitsing zou
             een kleine shadow_n_top het onlaadbudget kunstmatig inkorten. #}
          {# v1.9.2: P × η_uit is de kWh-per-uur AFNAME (vermogen-kap), niet
             het verlies — het verlies zit al in kwh_nog. Eerder stond hier
             P × η² → budget dubbel gekort (16 vs 18 uur) en viel de
             verkooptak weg. #}
          {% set n_top = ((kwh_nog / [P, 0.001] | max) | int) if P > 0 else 0 %}
          {# Top-verkiezing: de n_top duurste nog KOMENDE kwartierslots van
             vandaag+morgen die boven de verkoop-eis liggen. Vergelijken op
             epoch (e.e), dus robuust tegen ISO/epoch-verschillen. #}
          {% set cand = namespace(l=[]) %}
          {% for dag in ['vandaag', 'morgen'] %}
            {% for e in state_attr('sensor.stroomprijs_daglijst', dag) | default([], true) %}
              {% if e.e is defined and e.uit is defined and e.e > nu_epoch %}
                {% set p_uit = e.uit | float(none) %}
                {% if p_uit is not none and p_uit > v_eis_net %}
                  {% set cand.l = cand.l + [[p_uit, e.e]] %}
                {% endif %}
              {% endif %}
            {% endfor %}
          {% endfor %}
          {# v1.9.2: het HUIDIGE kwartier meegenomen in de verkiezing — een
             duur uur dat nu loopt en boven de eis zit, mag nooit door de
             budgetregel worden geblokkeerd; alleen duurdere KOMENDE slots
             concurreren om het onlaadbudget. #}
          {% if nu2.uit_nu is not none and nu2.uit_nu > v_eis_net and nu2.t_nu is not none %}
            {% set cand.l = cand.l + [[nu2.uit_nu, nu2.t_nu]] %}
          {% endif %}
          {% set gesorteerd = (cand.l | sort(reverse=true, attribute=0))[:n_top] %}
          {% set top_set = namespace(slots=[]) %}
          {% for paar in gesorteerd %}{% set top_set.slots = top_set.slots + [paar[1]] %}{% endfor %}
          {% set in_top = (nu2.t_nu is not none) and (nu2.t_nu in top_set.slots) %}
          {% set g_laden = V - H %}
          {% set g_laden_uit = V + H %}
          {% set g_eis_in_zon = v_eis_zon + H %}
          {% set g_eis_uit_zon = v_eis_zon - H %}
          {% set g_eis_in_net = v_eis_net + H %}
          {% set g_eis_uit_net = v_eis_net - H %}
          {# v1.9.5: Ontladen vereist minimaal marge G boven de eis (net) — een
             euro net boven de drempel is geen winst na omzettingverliezen. #}
          {# v1.9.5: eis + marge — de OR-valteinden van vóór 1.9.5 (> eis)
             bestaan niet meer: verkopen moet méér dan de eis plus marge
             opleveren. De input is de ABSOLUTE ondergrens (default 0,20);
             als marge geldt een tiende daarvan (0,02 €/kWh). #}
          {# v1.9.5: de marge is zélf de hysterese H — zo sluit de winstdrempel
             exact op de uit-band aan en verandert de floor niets aan het
             bandgedrag dat test_shadow_ontladen_hysterese_v185 contracteert. #}
          {% set MARGE = H %}
          {% set FLOOR = states('input_number.shadow_verkoop_eis_min') | float(0.20) %}
          {% set g_winst_net = [g_eis_in_net, FLOOR - MARGE] | max %}
          {% set g_winst_zon = [g_eis_in_zon, FLOOR - MARGE] | max %}
          {% set zon_op = state_attr('sun.sun', 'above_horizon') == 'true'
                          or states('sun.sun') == 'above_horizon' %}
          {# v1.9.6 (Claude-patch): de Ontladen-eis wordt bepaald door de
             GOEDKOOPSTE herlaadroute. Bij zon kan het overschot gratis via de
             zon terugkomen; dan is v_eis_zon (vaak lager dan v_eis_net) leidend.
             Zonder deze min() toetst de verkooptak bij zon_op tegen de dure
             zon-eis terwijl het attr verkoop_eis alleen de net-eis toont —
             precies wat test_shadow_ontladen_hysterese_v185 en
             test_shadow_reserve_band_flappert_niet_v185 deed falen. #}
          {% set v_eis_act = ([v_eis_net, v_eis_zon] | min) if zon_op else v_eis_net %}
          {% set g_eis_in_act = v_eis_act + H %}
          {% set g_eis_uit_act = v_eis_act - H %}
          {% set besluit = namespace(s='unavailable') %}
          {% if nu2.in_nu is not none and nu_epoch - nu2.t_nu <= 2700 %}

            {# Beslisketen — eerste treffer wint, volgorde zoals gespecificeerd:
               Laden-hold → Ontladen (hold, vers) → Doorleveren (hold, vers) →
               Laden-vers → Neutraal-hold → Spaar → Neutraal.
               De zesde status die hier ooit stond is opgeheven; de reserve leeft
               alleen in binary_sensor.shadow_accu_blokkade (niet wijzigen).
               Ontladen-eis splitst: zonvolume (boven doel-SOC) toetst tegen
               v_eis_zon, netvolume (vullen tot de reserve) tegen v_eis_net. #}
            {%- if prev == 'Laden' and nu2.in_nu + w + m < g_laden_uit and R2 < R2H %}{% set besluit.s = 'Laden' %}
            {%- elif prev == 'Ontladen' and not in_reserve and nu2.uit_nu is not none
                 and nu2.uit_nu > g_eis_uit_act
                 and (in_top or (nu2.uit_nu is not none
                                 and nu2.uit_nu >= (g_winst_zon if zon_op else g_winst_net))) %}{% set besluit.s = 'Ontladen' %}
            {%- elif not in_reserve and nu2.uit_nu is not none
                 and nu2.uit_nu > g_eis_in_act
                 and (in_top or (nu2.uit_nu is not none
                                 and nu2.uit_nu >= (g_winst_zon if zon_op else g_winst_net))) %}{% set besluit.s = 'Ontladen' %}
            {%- elif prev == 'Doorleveren' and zon_op and (R2 >= 0 or states('sensor.accu_percentage') | float(0) >= 98) %}{% set besluit.s = 'Doorleveren' %}
            {%- elif zon_op and (R2 > 0 or states('sensor.accu_percentage') | float(0) >= 100) and nu2.uit_nu is not none and nu2.uit_nu <= g_eis_in_net %}{% set besluit.s = 'Doorleveren' %}
            {%- elif nu2.in_nu + w + m < g_laden and (R2 < 0 or in_reserve) %}{% set besluit.s = 'Laden' %}
            {%- elif prev == 'Neutraal' and nu2.in_nu >= g_laden %}{% set besluit.s = 'Neutraal' %}
            {# v1.9.6 (Claude-patch): Spaar-tak onder de reserve, zoals in HEAD.
               Bij een lege accu-blokkade mag dure stroom niet door de Neutraal-tak
               worden opgepikt: soc <= flor en dure in-prijs met V boven eis+H is
               verwachte-verlies-laden → Spaar. Verwacht door stap 5 van
               test_shadow_huisreserve_is_apart_signaal_v190. #}
            {%- elif in_reserve and nu2.in_nu + w + m >= g_eis_in_act %}{% set besluit.s = 'Spaar' %}
            {%- elif nu2.in_nu < g_laden_uit %}{% set besluit.s = 'Spaar' %}
            {%- else %}{% set besluit.s = 'Neutraal' %}{% endif %}
          {%- endif %}
          {{ besluit.s }}
        attributes:
          price_status: "prijsstatus"
          in_nu: >
            {% set ns = namespace(v=none) %}
            {% for e in state_attr('sensor.stroomprijs_daglijst', 'vandaag') | default([], true) %}
              {% if e.t is defined and e.in is defined %}
                {% set ts = e.t | as_datetime %}
                {% if ts <= now() %}{% set ns.v = e.in | float(0) %}{% endif %}
              {% endif %}
            {% endfor %}
            {{ ns.v }}
          uit_nu: >
            {% set ns = namespace(v=none) %}
            {% for e in state_attr('sensor.stroomprijs_daglijst', 'vandaag') | default([], true) %}
              {% if e.t is defined and e.uit is defined %}
                {% set ts = e.t | as_datetime %}
                {% if ts <= now() %}{% set ns.v = e.uit | float(0) %}{% endif %}
              {% endif %}
            {% endfor %}
            {{ ns.v }}
          V: "{{ states('sensor.shadow_v_waarde_opgeslagen_kwh') }}"
          verkoop_eis: "{{ states('sensor.shadow_verkoop_eis_net') }}"
          verkoop_eis_zon: "{{ states('sensor.shadow_verkoop_eis_zon') }}"
          herlaadkosten_net: "{{ states('sensor.shadow_herlaadkosten_net') }}"
          herlaadkosten_zon: "{{ states('sensor.shadow_herlaadkosten_zon') }}"
          doel_SOC: "{{ states('sensor.shadow_doel_soc') }}"
          R: "{{ states('sensor.shadow_ruimtegebrek_r') }}"
          SOC: "{{ states('sensor.accu_percentage') }}"
          # v1.9.2 — reserve-aware planning, transparant voor het dashboard:
          kwh_tot_reserve: >-
            {% set soc_raw = states('sensor.accu_percentage') %}
            {% set soc_num = soc_raw | float(-1) %}
            {% set flor = states('input_number.accu_reserve_pct') | float(20) %}
            {% set C = states('input_number.shadow_capaciteit') | float(92) %}
            {% set eta_u = (states('input_number.rendement_ontlaad_pct') | float(90) if has_value('input_number.rendement_ontlaad_pct') else 90.0) / 100 %}
            {{ (((soc_num - flor) / 100 * C * eta_u) | round(2)) if soc_num >= 0 and soc_num > flor else 0 }}
          ontlaadbare_uren: >-
            {% set soc_raw = states('sensor.accu_percentage') %}
            {% set soc_num = soc_raw | float(-1) %}
            {% set flor = states('input_number.accu_reserve_pct') | float(20) %}
            {% set C = states('input_number.shadow_capaciteit') | float(92) %}
            {% set eta_u = (states('input_number.rendement_ontlaad_pct') | float(90) if has_value('input_number.rendement_ontlaad_pct') else 90.0) / 100 %}
            {% set P = states('input_number.accu_vermogen_uit_kw') | float(5) if has_value('input_number.accu_vermogen_uit_kw') else 5.0 %}
            {% set kwh_nog = [((soc_num - flor) / 100 * C * eta_u), 0] | max if soc_num >= 0 else 0 %}
            {{ ((kwh_nog / [P * eta_u, 0.001] | max) | int) if P > 0 else 0 }}
          # v1.9.0: de vier interne poorten blootgeven zodat het dashboard
          # de blokkade kan verklaren zónder te gokken. Elke attribute heeft
          # zijn eigen volledige set — geen gedeelde variabelen met de state.
          # v1.9.0: de oude SOC-poorten (verkoop_blokkade, spaar_blokkade,
          # neutraal_vrij, in_reserve, band_uit) zijn UIT de statuskeuze. De
          # reserve leeft alleen nog in binary_sensor.shadow_accu_blokkade;
          # deze twee attributen spiegelen die blokkade op de statussensor.
          blokkade: >
            {# v1.9.0: spiegeling van de SOC-reserve op de statussensor.
               Zelfstandig uitgerekend (dezelfde formules als
               binary_sensor.shadow_accu_blokkade) — de sensor kijgt hier géén
               cycliciteit: hij leest alleen de STATUS (die dit attribuut zelf
               niet beïnvloedt), SOC en flor. Laden toont hier geen
               blokkade: laden is juist hoe je boven de reserve komt. #}
            {# v1.9.0 fix: puur-SOC-spigel van binary_sensor.shadow_accu_blokkade
               (dezelfde band, zonder latch). Géén statusfilter hier: het
               attributes-dict wordt VÓÓR de state gezet en `this.state` is
               dan stale (vorige render), terwijl update_on_state bij een
               statuswissel naar Laden precies één render met die oude
               basis forcéérde — de test ving dat. Laden hoeft geen
               blokkade te *tonen* om toch correct te werken: de statussensor
               adviseert het onafhankelijk van SOC (Laden heeft eigen
               SOC-gates), en de binaire sensor is de
               bron van waarheid voor downstream-acties. #}
            {% set soc_raw = states('sensor.accu_percentage') %}
            {% set soc_num = soc_raw | float(-1) %}
            {% set soc_ok = soc_raw not in ['unknown', 'unavailable'] and soc_num >= 0 %}
            {% set flor = states('input_number.accu_reserve_pct') | float(20) %}
            {{ 'on' if (not soc_ok) or soc_num <= flor else 'off' }}
          toelichting: >
            {% set s = states('sensor.shadow_status') %}
            {% set soc_raw = states('sensor.accu_percentage') %}
            {% set soc_num = soc_raw | float(-1) %}
            {% set soc_ok = soc_raw not in ['unknown', 'unavailable'] and soc_num >= 0 %}
            {% set flor = states('input_number.accu_reserve_pct') | float(20) %}
            {% set in_reserve = soc_ok and soc_num <= flor %}
            {% set blk = in_reserve %}
            {% if blk and s in ['Neutraal', 'Ontladen', 'Doorleveren'] %}
            {{ s ~ ' (accu leeg, niet fysiek mogelijk)' }}
            {% else %}{{ '' }}{% endif %}

# ═══════════════════════════════════════════════════════════════════
#  v1.9.0 — SHADOW ACCU-BLOKKADE (apart signaal, geen prijsstatus)
#  De SOC-reserve (flor-band flor..flor+2) is uit de status-sensor
#  gehaald: shadow_status is nu een zuivere prijs-/economiestatus.
#  Deze binaire sensor geeft aan of de accu-reserve een verkoop/spaar-
#  besluit blokkeert. Fail-safe: onbekende SOC → on (nooit stille
#  verkoop uit de reserve). Laden is NOOIT een blokkade:
#  laden is juist hoe je boven de reserve komt.
# ═══════════════════════════════════════════════════════════════════
    binary_sensor:
      # v1.9.0: HA wil binaire template-sensoren NESTED onder `template:`
      # (top-level `binary_sensor:` in een package heeft een platform nodig).
      - name: "Shadow accu-blokkade"
        unique_id: energyprijs_shadow_accublokkade
        state: >
          {# v1.9.0: puur SOC-reserve-signaal met eigen hysterese-band.
             on  bij soc unknown/unavailable of soc ≤ flor;
             latch: eenmaal on blijft on tot soc > flor + 2
             (opklimmen 18 → 21: nog on; pas bij 23 uit).
             GEEN status-afhankelijkheid — bewust. De status-sensor spiegelt
             dit signaal in zijn attributen (status→attributen→herberekening);
             zou DIT signaal ook naar de status kijken, dan ontstaat een
             terugkoppel-cyclus die bij Laden elke tick aan/uit flopt
             (de latch kan zichzelf niet handhaven door een status-heenweg).
             Laden wordt daarom hier NIET uitgezonderd: de
             statussensor filtert ze in zijn eigen 'blokkade'-attribuut. #}
          {% set prev_bs = states('binary_sensor.shadow_accu_blokkade') | default('', true) | string %}
          {% set soc_raw = states('sensor.accu_percentage') %}
          {% set soc_num = soc_raw | float(-1) %}
          {% set soc_ok = soc_raw not in ['unknown', 'unavailable'] and soc_num >= 0 %}
          {% set flor = states('input_number.accu_reserve_pct') | float(20) %}
          {# v1.9.7: puur soc ≤ flor — het v1.9.0-contract (geen flor+2-band,
             géén prev-latch: states() van deze sensor is hier stale). De
             anti-fladder- eigenschap komt van de NIEUWE flor-bron: primary
             accu_reserve_pct, exact zoals de verbruiks-/reserve-takken die
             al lezen. Eerder las dit signaal shadow_soc_min (fallback 20)
             terwijl de takken accu_reserve_pct lazen: bij gelijke SOC-grens
             ging on/off per tick afwisselen en sleepde de statussensor mee
             (de 'vloeiende overgang' die Jan live zag, nov '26). #}
          {{ (not soc_ok) or soc_num <= flor }}
        attributes:
          flor: "{{ states('input_number.accu_reserve_pct') }}"
          SOC: "{{ states('sensor.accu_percentage') }}"
          status: "{{ states('sensor.shadow_status') }}"

automation:
  # ── beslis-logboek: elke statuswijziging in het HA-logboek én als
  #    persistent event (recorder) zodat het maandrapport het kan lezen ──
  #  v1.5.2: de trigger vereist nu een VEELEKEER veranderde status (from + to
  #  + from != to). Oude versie: elke state-set met not unavailable → telde
  #  onbekend→bekend-overgangen (kwartier-index-gap) óók mee.
  #  De action zet óók de geheugenknop (input_text.shadow_status_vorige) die
  #  de status-sensor leest voor de hysterese. NOT: input_text in triggers —
  #  de sensor leest hem wel via states(), dus HA triggert op elke write.
  - alias: "Shadow handel — log elke statusbeslissing"
    id: energyprijs_shadow_log
    mode: queued
    max: 10
    triggers:
      - trigger: state
        entity_id: sensor.shadow_status
        to:
          - Laden
          - Spaar
          - Neutraal
          - Doorleveren
          - Ontladen
        not_from:
          - unavailable
          - unknown
    actions:
      # v1.5.2: de geheugenknop eerst zetten — de status-sensor leest deze
      # (via states() tijdens renderen) en HA triggert op de write, dus de
      # sensor herberekent ééns met de nieuwe prev-waarde. Zonder deze stap
      # kent de hysterese de vorige status niet.
      - action: input_text.set_value
        target:
          entity_id: input_text.shadow_status_vorige
        data:
          value: "{{ trigger.to_state.state }}"
      # v1.5.9: de notify-actie deed de hele automation onbeschikbaar maken
      # (oct '26: 12 dagen shadow-test liep zonder beslissingslog). Nu:
      # template-renderen + event_fired (persistent in het event-log) +
      # optionele notify (continue_on_error vangt ServiceNotFound af).
      - variables:
          shadow_log_rij: >
            {{ states('sensor.shadow_status') }} | in={{ state_attr('sensor.shadow_status','in_nu') }}
            uit={{ state_attr('sensor.shadow_status','uit_nu') }} V={{ states('sensor.shadow_v_waarde_opgeslagen_kwh') }}
            eis={{ states('sensor.shadow_verkoop_eis_net') }} R={{ states('sensor.shadow_ruimtegebrek_r') }}
            doelSOC={{ states('sensor.shadow_doel_soc') }}% SOC={{ states('sensor.accu_percentage') }}%
            blokkade={{ state_attr('sensor.shadow_status','blokkade') }}
      - action: event
        event_type: energyprijs_shadow_statusbeslissing
        event_data:
          timestamp: "{{ now().isoformat() }}"
          status: "{{ trigger.to_state.state }}"
          from: "{{ trigger.from_state.state if trigger.from_state else 'onbekend' }}"
          in_nu: "{{ state_attr('sensor.shadow_status','in_nu') }}"
          uit_nu: "{{ state_attr('sensor.shadow_status','uit_nu') }}"
          v: "{{ states('sensor.shadow_v_waarde_opgeslagen_kwh') }}"
          verkoop_eis: "{{ states('sensor.shadow_verkoop_eis_net') }}"
          r: "{{ states('sensor.shadow_ruimtegebrek_r') }}"
          doel_soc: "{{ states('sensor.shadow_doel_soc') }}"
          soc: "{{ states('sensor.accu_percentage') }}"
          # v1.9.0: de accu-blokkade meeloggen (apart signaal, geen status).
          blokkade: "{{ state_attr('sensor.shadow_status','blokkade') }}"
          rij: "{{ shadow_log_rij }}"
      - action: >-
          {% set d = states('input_text.prijs_notify_doel') | trim %}
          {{ 'notify.' ~ (d if d not in ['', 'unknown', 'unavailable', 'none'] else 'persistent_notification') }}
        data:
          title: "Shadow handel — statuswijziging"
          message: "{{ shadow_log_rij }}"
        continue_on_error: true
      - action: persistent_notification.create
        data:
          notification_id: energyprijs_shadow_wijziging
          title: "Shadow handel"
          message: >
            Status: {{ states('sensor.shadow_status') }} —
            in {{ state_attr('sensor.shadow_status','in_nu') }} ·
            uit {{ state_attr('sensor.shadow_status','uit_nu') }} ·
            V {{ states('sensor.shadow_v_waarde_opgeslagen_kwh') }} · eis {{ states('sensor.shadow_verkoop_eis_net') }} ·
