          - input_number.prijs_btw
          - input_number.prijs_energiebelasting
          - input_number.prijs_opslag_afname
          - input_number.prijs_opslag_levering
          - input_boolean.prijs_saldering_energiebelasting_teruggave
          # tariefcontract 2028 + rendement-contract (v1.5.5)
          - input_number.prijs_opslag_tijdsafhankelijk
          - input_number.prijs_dal_uren
          - input_number.prijs_top_uren
          - input_text.prijs_net_blokken
          - input_number.rendement_roundtrip_pct
          # v1.6.2: de toeslag-sensor zelf in de triggers — vóór deze fix kon
          # afname/levering op een uurgrens tot 5 min met de oude toeslag rekenen
          - sensor.energyprijs_opslag_toeslag
          - sensor.stroomprijs_basis
      # elk kwartier opnieuw kijken: de tijdsafhankelijke toeslag hangt van het
      # lokale uur af, dus de formule moet aan de kloktijd volgen (net als de
      # daglijst-karteer-cyclus; nu is dat 5 min — genoeg voor een op-uur-grens)
      - trigger: time_pattern
        minutes: "/5"
    sensor:
      # ── AFNAME all-in = (basis + opslag + energiebelasting) × (1+btw)
      - name: "Stroomprijs afname"
        unique_id: stroomprijs_afname
        unit_of_measurement: "EUR/kWh"
        state_class: measurement
        availability: >-
          {% set ts = states('input_number.prijs_opslag_tijdsafhankelijk') | float(0) | default(0, true) %}
          {{ has_value('sensor.stroomprijs_basis')
             and (ts <= 0 or has_value('sensor.energyprijs_opslag_toeslag')) }}
        state: >
          {% set toel = states('sensor.energyprijs_opslag_toeslag') | float(0) %}
          {{ ((states('sensor.stroomprijs_basis') | float(0)
               + states('input_number.prijs_opslag_afname') | float(0) + toel
               + states('input_number.prijs_energiebelasting') | float(0))
              * (1 + states('input_number.prijs_btw') | float(0.21))) | round(6) }}

      # ── LEVERING all-in = (basis + leveringopslag) × (1+btw); NA 2027 géén belasting-teruggave.
      #    Tot 1-1-2027 geldt saldering: teruggave = belasting; zet dan het salderings-veld op 1.
      - name: "Stroomprijs levering"
        unique_id: stroomprijs_levering
        unit_of_measurement: "EUR/kWh"
        state_class: measurement
        availability: >-
          {% set ts = states('input_number.prijs_opslag_tijdsafhankelijk') | float(0) | default(0, true) %}
          {{ has_value('sensor.stroomprijs_basis')
             and (ts <= 0 or has_value('sensor.energyprijs_opslag_toeslag')) }}
        state: >
          {% set saldering = states('input_boolean.prijs_saldering_energiebelasting_teruggave') == 'on' %}
          {% set basis = states('sensor.stroomprijs_basis') | float(0) %}
          {% set btw = 1 + states('input_number.prijs_btw') | float(0.21) %}
          {% set toel = states('sensor.energyprijs_opslag_toeslag') | float(0) %}
          {{ ((basis + states('input_number.prijs_opslag_levering') | float(0) + toel) * btw
              + (states('input_number.prijs_energiebelasting') | float(0) * btw if saldering else 0)) | round(6) }}

  # ── ACCU-CONTRACT: sensor.energyprijs_accu_percentage = vaste, botsingvrije naam.
  #    input_text.accu_bron_entity bevat een entity_id → deze state-based template
  #    volgt die LIVE (states(src) wordt tijdens renderen opgevraagd; HA triggert
  #    op elke entiteit die de template leest — óók dynamisch gekozen). Geen
  #    triggers-blok nodig; expliciete triggers zouden het juist on-live maken.
  #    Leeg veld of onbeschikbare bron → unavailable + "Geen bron ingesteld".
  #    Zelfverwijzing (bron == eigen id) → unavailable, geen lus.
  - sensor:
      - name: "Energyprijs Accu percentage"
        unique_id: energyprijs_accu_percentage
        unit_of_measurement: "%"
        state_class: measurement
        availability: >-
          {% set src = states('input_text.accu_bron_entity') | trim %}
          {{ bool(src and src not in ('unknown', 'unavailable', 'none')
                  and src != 'sensor.energyprijs_accu_percentage'
                  and has_value(src)) }}
        state: >-
          {% set src = states('input_text.accu_bron_entity') | trim %}
          {% if src and src not in ('unknown', 'unavailable', 'none')
                and src != 'sensor.energyprijs_accu_percentage' %}
            {{ states(src) }}
          {% else %}
            none
          {% endif %}

  # ── RESERVE-CONTRACT (v1.4.0): input_number.accu_reserve_pct is de ondergrens
  #    in procenten; deze sensor vertaalt naar kWh zodat formules niet zelf hoeven
  #    te vermenigvuldigen. Leest bewust BEIDE accu-contractnamen (de oude
  #    sensor.accu_percentage van het handels-circuit én onze eigen snelkoppeling)
  #    — zolang minstens één een verse waarde heeft, telt de reserve mee.
  #    Reserve-% leeg/0 → availability false (onbruikbare grens is geen grens van 0).
  - sensor:
      - name: "Energyprijs Accu reserve"
        unique_id: energyprijs_accu_reserve_kwh
        unit_of_measurement: "kWh"
        state_class: measurement
        availability: >-
          {% set res = states('input_number.accu_reserve_pct') | float(-1) %}
          {% set cap = states('input_number.accu_capaciteit_kwh') | float(-1) %}
          {% set _soc_list = [states('sensor.energyprijs_accu_percentage'),
                              states('sensor.accu_percentage')]
                             | map('float', -1) | select('ge', 0) | list %}
          {% set soc = (_soc_list | max) if (_soc_list | count > 0) else -1 %}
          {{ res > 0 and cap > 0 and soc >= 0 }}
        state: >-
          {% set res = states('input_number.accu_reserve_pct') | float(-1) %}
          {% set cap = states('input_number.accu_capaciteit_kwh') | float(-1) %}
          {{ (res / 100 * cap) | round(2) }}

  # ── PV-CONTRACT (v1.3.0): twee vaste, botsingvrije contract-namen voor de
  #    verwachte zonnestroom. input_text.pv_bron_vandaag/morgen bevatten elk een
  #    entity_id (bijv. een Forecast.Solar-sensor). State-based templates volgen
  #    de gekozen bron live, net als de accu-snelkoppeling. Beide velden leeg of
  #    onbeschikbaar → unavailable + "Geen bron ingesteld".
  - sensor:
      - name: "Energyprijs PV vandaag"
        unique_id: energyprijs_pv_vandaag
        unit_of_measurement: "kWh"
        state_class: measurement
        availability: >-
          {% set src = states('input_text.pv_bron_vandaag') | trim %}
          {{ bool(src and src not in ('unknown', 'unavailable', 'none')
                  and src != 'sensor.energyprijs_pv_vandaag'
                  and has_value(src)) }}
        state: >-
          {% set src = states('input_text.pv_bron_vandaag') | trim %}
          {% if src and src not in ('unknown', 'unavailable', 'none')
                and src != 'sensor.energyprijs_pv_vandaag' %}
            {{ states(src) | float(0) }}
          {% else %}
            none
          {% endif %}

      - name: "Energyprijs PV morgen"
        unique_id: energyprijs_pv_morgen
        unit_of_measurement: "kWh"
        state_class: measurement
        availability: >-
          {% set src = states('input_text.pv_bron_morgen') | trim %}
          {{ bool(src and src not in ('unknown', 'unavailable', 'none')
                  and src != 'sensor.energyprijs_pv_morgen'
                  and has_value(src)) }}
        state: >-
          {% set src = states('input_text.pv_bron_morgen') | trim %}
          {% if src and src not in ('unknown', 'unavailable', 'none')
                and src != 'sensor.energyprijs_pv_morgen' %}
            {{ states(src) | float(0) }}
          {% else %}
            none
          {% endif %}

  # ── v1.5.9: waarschuwing als het blokmodel aanstaat (ts>0) maar de
  #    blokfactoren-tekst leeg is → opslag_toeslag is dan unavailable.
  - binary_sensor:
      - name: "Energyprijs nettoeslag blokken ontbreken"
        unique_id: energyprijs_nettoeslag_blokken_ontbreken
        delay_on: "00:02:00"
        device_class: problem
        state: >-
          {% set ts = states('input_number.prijs_opslag_tijdsafhankelijk') | float(0) | default(0, true) %}
          {% set txt = states('input_text.prijs_net_blokken') | default('', true) | trim %}
          {{ ts > 0 and txt == '' }}

input_number:
  # OPLET: geen 'initial' hier. initial zet de waarde bij ELKE herstart terug
  # en wist daarmee de door Jan ingestelde contractwaarden. Zonder initial
  # herstelt HA de laatst opgeslagen waarde; bij de aller-EERSTE start (geen
  # opgeslagen waarde) is de helper even 0 → de installer zet de defaults
  # éénmalig via _defaults_gezet in entry.data (zie __init__.py).
  prijs_btw:
    name: "Prijs: BTW"
    min: 0
    max: 1
    step: 0.001
    mode: box
    icon: mdi:percent
  prijs_energiebelasting:
    name: "Prijs: energiebelasting excl btw"
    min: 0
    max: 1
    step: 0.0001
    mode: box
    icon: mdi:transmission-tower
  prijs_opslag_afname:
    name: "Prijs: leveranciersopslag afname"
    min: 0
    max: 1
    step: 0.0001
    mode: box
    icon: mdi:store
  prijs_opslag_levering:
    name: "Prijs: leveranciersopslag levering"
    min: 0
    max: 1
    step: 0.0001
    mode: box
    icon: mdi:store-check
  prijs_laad_fractie:
    name: "Prijs: laad-fractie (× laagste uur van de dag)"
    unit_of_measurement: "×"
    min: 1
    max: 3
    step: 0.05
    mode: box
    icon: mdi:ev-station
  prijs_afwijkingsdrempel:
    name: "Prijs: afwijkingsdrempel kruiscontrole"
    min: 0
    max: 1
    step: 0.001
    mode: box
    icon: mdi:scale-balance
  accu_capaciteit_kwh:
    name: "Accu: capaciteit (kWh)"
    unit_of_measurement: "kWh"
    min: 0
    max: 500
    step: 0.1
    mode: box
    icon: mdi:battery-high
  accu_vermogen_in_kw:
    name: "Accu: laadvermogen max (kW)"
    unit_of_measurement: "kW"
    min: 0
    max: 100
    step: 0.1
    mode: box
    icon: mdi:current-dc
  accu_vermogen_uit_kw:
    name: "Accu: ontlaadvermogen max (kW)"
    unit_of_measurement: "kW"
    min: 0
    max: 100
    step: 0.1
    mode: box
    icon: mdi:current-dc
  accu_reserve_pct:
    # RESERVE-CONTRACT (v1.4.0): de SOC-ondergrens die het systeem NOOIT mag
    # underschrijden — netstoring-overbrugging + cel-beveiliging. Alles erboven
    # is vrij speelgeld van de solver/handelslogica. Eén bron van waarheid
    # (herontwerp les §5.5): formules en automatiseringen lezen deze helper,
    # nooit een hardcoded 20%. Bewust géén 'initial': HA herstelt de laatste
    # gebruikerswaarde; de installer zet éénmalig de default (zie HELPERS_DEFAULTS).
    name: "Accu: reserve (%, ondergrens SOC)"
    unit_of_measurement: "%"
    min: 0
    max: 100
    step: 1
    mode: box
    icon: mdi:battery-alert-variant-outline
  # ── RENDEMENT-CONTRACT (v1.5.5): gemeten omzettingsrendementen uit eigen HA-data
  #    (accu_verlies_meten.py, periode aug→okt '26; AC-zijde = P1 + Deye load).
  #    Eén bron van waarheid: formules en shadow lezen deze helpers, geen
  #    hardcoded η. Startwaarden via HELPERS_DEFAULTS (installer.py).
  rendement_laad_pct:
    name: "Rendement: laden net→cel (%)"
    unit_of_measurement: "%"
    min: 0
    max: 100
    step: 0.5
    mode: box
    icon: mdi:battery-charging-high
  rendement_ontlaad_pct:
    name: "Rendement: ontladen cel→AC (%)"
    unit_of_measurement: "%"
    min: 0
    max: 100
    step: 0.5
    mode: box
    icon: mdi:battery-arrow-down-outline
  rendement_roundtrip_pct:
    name: "Rendement: roundtrip net→cel→net (%)"
    unit_of_measurement: "%"
    min: 0
    max: 100
    step: 0.5
    mode: box
    icon: mdi:sync
  # ── TARIEFCONTRACT 2028 (v1.5.5): per 1-1-2028 worden leverancierskosten
  #    (vaste opslag) tijdsonafhankelijk vervangen door een variabele toeslag
  #    per uur (ACM-kamerbrief; exacte bedragen nog vast te stellen — Jan vult
  #    ze in zodra contract/ACM ze noemt). De uren-grenzen staan in JANS lokale
  #    klok (CEST/Winter); de daglijst-intervallen zijn UTC-geannoteerd en
  #    worden hieromrekend. Dal = uren < dal_uren OF >= 24 (nacht); top =
  #    dal_uren <= uur < top_uren is schouder; rest tot middernacht valt in
  #    de AVP-topruimte vanaf top_uren.
  prijs_dal_uren:
    name: "Tarief 2028: dal tot (uur, lokale klok)"
    unit_of_measurement: "u"
    min: 0
    max: 24
    step: 1
    mode: box
    icon: mdi:weather-night
  prijs_top_uren:
    name: "Tarief 2028: AVP-top vanaf (uur, lokale klok)"
    unit_of_measurement: "u"
    min: 0
    max: 24
    step: 1
    mode: box
    icon: mdi:weather-sunset-up
  prijs_opslag_tijdsafhankelijk:
    name: "Tarief 2028: tijdsafhankelijke opslag (EUR/kWh)"
    unit_of_measurement: "EUR/kWh"
    min: 0
    max: 1
    step: 0.0001
    mode: box
    icon: mdi:clock-alert-outline

input_boolean:
  prijs_saldering_energiebelasting_teruggave:
    name: "Prijs: saldering (belasting-teruggave bij levering)"
    icon: mdi:solar-power
    # NU: on (saldering nog van kracht t/m 31-12-2026).
    # Per 1-1-2027: uitzetten → leveringformule valt automatisch terug op spot+btw.

input_text:
  accu_bron_entity:
    min: 0
    max: 255
    mode: text
    icon: mdi:source-branch
  pv_bron_vandaag:
    min: 0
    max: 255
    mode: text
    icon: mdi:weather-sunny
  pv_bron_morgen:
    min: 0
    max: 255
    mode: text
    icon: mdi:weather-sunset
  prijs_notify_doel:
    min: 0
    max: 255
    mode: text
    icon: mdi:bell-cog
  # ── NETTOESLAG PER TIJDSBLOK (v1.5.9): factoren per uur conform ACM-
  #    codewijziging BR-2026-2242 bijlage 5 (5 blokken/dag; april t/m sept
  #    = zomerprofiel, anders winterprofiel). Formaat: blokken gescheiden door
  #    PUNTKOMMA's, seizoen-prefix optioneel ('W|0-1:0,65;W|1-15:0,48;...'),
  #    komma decimaal, prefixloze blokken gelden voor beide seizoenen. LEEG +
  #    toeslag-helper >0 → opslag_toeslag unavailable + notificatie.
  prijs_net_blokken:
    min: 0
    max: 255
    mode: text
    icon: mdi:grid

automation:
  - alias: "Prijzen: meld bij bronuitval of basis-onbetrouwbaar"
    id: prijzen_meld_bronuitval
    mode: restart
    triggers:
      - trigger: state
        entity_id:
          - sensor.stroomprijs_basis
          - sensor.prijzen_bron_nordpool
          - sensor.prijzen_bron_enerprice
          - sensor.prijzen_bron_energyzero
        to: ["unavailable", "unknown"]
        for: "00:05:00"
      - trigger: state
        entity_id: binary_sensor.prijzen_kruiscontrole_afwijking
        to: "on"
        for: "00:05:00"
    conditions: []
    actions:
      - action: >-
          {% set d = states('input_text.prijs_notify_doel') | trim %}
          {{ 'notify.' ~ (d if d not in ['', 'unknown', 'unavailable', 'none'] else 'persistent_notification') }}
        data:
          title: "⚡ Stroomprijs-basis verstoord"
          message: >
            {% if trigger.entity_id == 'sensor.stroomprijs_basis' %}
            Geen twee verse bronnen meer — basis is unavailable. Berekeningen pauzeren.
            {% elif trigger.entity_id == 'binary_sensor.prijzen_kruiscontrole_afwijking' %}
            Kruiscontrole: spreiding {{ state_attr('sensor.stroomprijs_basis','spreiding') }} EUR/kWh boven drempel.
            {% else %}
            Bron {{ trigger.entity_id.split('.')[-1] }} valt weg. Actieve bronnen:
            {{ state_attr('sensor.stroomprijs_basis','bronnen_actief') | join(', ') }}.
            {% endif %}

  # v1.5.3: melding verduidelijkt — de daglijst pakt nu de EERSTE bron met
  # morgenprijzen (zie attributes.bron op sensor.stroomprijs_daglijst); de
  # overige bronnen dienen als verifiëring (kruiscontrole op het momentprijs).
  - alias: "Prijzen: herinner om 15:15 als morgenprijzen ontbreken"
    id: prijzen_meld_morgen_missing
    mode: single
    triggers:
      - trigger: time
        at: "15:15"
    conditions:
      - condition: state
        entity_id: binary_sensor.prijzen_morgen_beschikbaar
        state: "off"
    actions:
      - action: >-
          {% set d = states('input_text.prijs_notify_doel') | trim %}
          {{ 'notify.' ~ (d if d not in ['', 'unknown', 'unavailable', 'none'] else 'persistent_notification') }}
        data:
          title: "⚠ Morgenprijzen nog niet binnen"
          message: >
            Om 15:15 heeft géén bron morgen-intervallen. Daglijst-bron:
            {{ state_attr('sensor.stroomprijs_daglijst', 'bron') | default('geen', true) }}.
            Actieve momentprijs-bronnen:
            {{ state_attr('sensor.stroomprijs_basis','bronnen_actief') | default(['geen'], true) | join(', ') }}.
            Planning vanmiddag niet uitvoeren tot ze binnen zijn.

  # v1.5.9: blokmodel aan (ts>0) maar geen blokfactoren ingevuld → melding.
  - alias: "Prijzen: meld ontbrekende nettoeslag-blokfactoren"
    id: prijzen_meld_nettoeslag_blokken
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.energyprijs_nettoeslag_blokken_ontbreken
        to: "on"
        for: "00:05:00"
    conditions: []
    actions:
      - action: >-
          {% set d = states('input_text.prijs_notify_doel') | trim %}
          {{ 'notify.' ~ (d if d not in ['', 'unknown', 'unavailable', 'none'] else 'persistent_notification') }}
        data:
          title: "⚠ Nettoeslag: blokfactoren leeg"
          message: >
            Tijdsafhankelijke opslag staat op
            {{ states('input_number.prijs_opslag_tijdsafhankelijk') }} EUR/kWh,
            maar input_text.prijs_net_blokken is leeg — de toeslag-sensor is
            unavailable en prijscalculaties pauzeren. Vul de blokfactoren in
            (formaat 'W|0-1:0,7;...' of laat ts op 0 voor het vaste contract).
# ── RECORDER: sensor.stroomprijs_daglijst draagt ±2×96 kwartieren in attributes ──
#    (±10 KB per state). Dat overschrijdt de 16 KB-limiet van recorder/state_change.
#    Dus uitgesloten van de history-opslag; de grafiek leest de LIVE-attributes,
#    die door de recorder niet beïnvloed worden. Anders krijgt Jan een "Failed to
#    commit database changes"-waarschuwing bij elke herberekening.
#    VORM: 'exclude' is een MAPPING met 'entities:' — de legacy lijst-vorm
#    ('exclude: [entity_id: [...]]') wordt door HA 2026.x afgewezen
#    ("expected a dictionary"), live gemeld door Jan op 3 okt '26.
recorder:
  exclude:
    entities:
      - sensor.stroomprijs_daglijst
      # v1.7.0: de prognose-sensor is informatief; 15-min history zou de DB
      # onnodig zwaar maken. (sensor.prijzen_voorspelling_raw bestaat niet meer;
      # de entiteit komt nu uit de integration en heet prijzen_bron_voorspelling.)
      - sensor.prijzen_bron_voorspelling

