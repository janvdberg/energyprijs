# ═══════════════════════════════════════════════════════════════
#  PACKAGE: energyprijs — bruto basisprijs (15 min) + all-in formules
#  Versie 1.7.9 · okt 2026 · bestemd voor /config/packages/energyprijs.yaml
#
#  Ontwerpregels (vastgelegd door Jan):
#   - Rekenen NOOIT met een prijs die niet geverifieerd verse data is.
#     Geen enkele bron vers → sensor unavailable + notificatie.
#   - Bruto (kale markt, excl. btw/belasting/opslag) is de basis voor
#     grafiek én arbitrage; all-in zit in aparte sensoren via input-velden.
#   - 2027-bestendig: saldering weg → alleen input_number/boolean verzetten.
#   - Kwartier-klaar: EnerPrice/Nord Pool leveren vanzelf 15-min intervallen
#     zodra de markt overgaat; templates werken op attributes-lijsten.
#
#  v1.5.5 — gemeten rendement + tijdsafhankelijke tarieven (okt '26):
#   1. Nieuwe helpers (installer HELPERS_DEFAULTS + input_number hieronder):
#      rendement_laad_pct=77, rendement_ontlaad_pct=90, rendement_roundtrip_pct=70
#      (P1↔Deye-meting, donkere uren), prijs_opslag_tijdsafhankelijk=0,
#      prijs_dal_uren=7, prijs_top_uren=17.
#   2. Daglijst-formules (vandaag/morgen) verwerken 'toel' (netto-opslag per
#      uur via sensor.energyprijs_opslag_toeslag) in in(t)/uit(t) en de rt-/
#      rt_uit-kolommen via rendement_roundtrip_pct. Handelen loont pas boven
#      spread/η — η staat NOOIT meer los getypt in formules.
#   3. Shadow: η = gemiddelde van laad/ontlaad-helpers; shadow_eta is alleen
#      nog noodvallet als die helpers ontbreken (has_value-check).
#
#  v1.2.33 — twee structurele correcties (live-log 3 okt, HA 2026.9.4):
#   1. Helpers zijn input_NUMBER met mode: box (invulvelden, geen sliders).
#      eerdere poging 'input_text met max/mode' faalde: die opties bestaan
#      daar niet → setup crashte en het hele package laadde niet.
#   2. Template-entiteiten met eigen triggers staan in GECOÖRDINEERDE blokken
#      ('triggers:' naast 'sensor:'). 'triggers' ín een sensor-item is volgens
#      HA's validator ongeldig (ensure_domains_do_not_have_trigger_or_action).
#
#  Benodigde integraties: MINSTENS ÉÉN van de drie bronnen hieronder.
#    Zonder bron blijven sensor.stroomprijs_basis e.d. unavailable — het dashboard
#    vult wél, toont N/A en waarschuwt in het log (geen fout, geen blokkade).
#   1. Nord Pool      (core)       → sensor.nord_pool_nl_current_price (excl. btw)
#   2. EnerPrice      (HACS custom)→ sensor.enerprice_nl_day_ahead_prices_*
#        bronnen-chain + cache; attributes prices_today/prices_tomorrow = {time, price}
#   3. EnergyZero     (core)       → sensor.energyzero_today_energy_current_hour_price (INCL btw!)
#   4. een notify-service (mobiel/Telegram/persistent) → vul diens naam in sonder
#      'notify.'-voorvoegsel in input_text.prijs_notify_doel (standaard leeg →
#      persistent_notification; niets faalt dan)
#
#  ⚠️ Na installatie controleren (Settings → Entiteiten):
#   - template entiteiten krijgen id's als sensor.prijzen_bron_nordpool,
#     sensor.stroomprijs_basis, sensor.stroomprijs_afname, … (HA slugify van name).
#     Mocht HA ergens _2 van maken (botsing), pas de onderlinge verwijzingen aan.
#   - binary_sensor.enerprice_nl_day_ahead_prices_api_data_available bestaat
#     gegarandeerd (uit EnerPrice-broncode bevestigd).
#   - Zet in de EnerPrice-integratieopties "extended attributes" AAN, dan pas
#     zijn prices_today/prices_tomorrow beschikbaar voor de daglijst.
#   - Oude rommel opruimen (optioneel, out-of-scope van dit package):
#     sensor.zonneplan_15_01_2026 e.d. blijven staan tot je oude automatiseringen
#     op sensor.stroomprijs_basis/afname/levering wijzen.
# ═══════════════════════════════════════════════════════════════

template:
  # ── v1.7.0 VOORSPELLINGSBRON: stroomvoorspeller.nl (CC-BY) ──
  #    De entiteit sensor.prijzen_bron_voorspelling komt NU uit de eigen
  #    integration (custom_components/energyprijs/sensor.py + voorspelling.py),
  #    niet uit dit template-blok. Directe async HTTP, geen /tmp, geen
  #    python_script, geen shell. Dag+1-filter + /1000-conversie zitten in
  #    voorspelling.py. Attribute 'prices_tomorrow' = [{time, price}] (EUR/kWh).
  #    INFORMATIEF: shadowPIES en de 15:15-melding lezen dit NOOIT.

  # ── STATE-BASED: bron-nabootsing + basis; luisteren automatisch naar hun inputs ──
  - sensor:
      # ── BRON 1: Nord Pool, ruw (excl. btw). GEEN daglijst in attributes —
      #    core-integratie heeft alleen nu/vorige/volgende + min/max sensoren.
      - name: "Prijzen bron Nordpool"
        unique_id: prijzen_bron_nordpool
        unit_of_measurement: "EUR/kWh"
        state_class: measurement
        availability: "{{ has_value('sensor.nord_pool_nl_current_price') }}"
        state: >
          {{ states('sensor.nord_pool_nl_current_price') }}
        attributes:
          beschikbaar: "{{ has_value('sensor.nord_pool_nl_current_price') }}"
          prices_today: "{{ [] }}"
          prices_tomorrow: "{{ [] }}"

      # ── BRON 2: EnerPrice market (excl. btw), incl. diens provider/cache-status.
      #    EXACTE attribute-namen conform repo-broncode (models.py as_attribute → {time, price}):
      #    prices / prices_today / prices_tomorrow op de current_market_price-sensor.
      - name: "Prijzen bron Enerprice"
        unique_id: prijzen_bron_enerprice
        unit_of_measurement: "EUR/kWh"
        state_class: measurement
        availability: >
          {{ is_state('binary_sensor.enerprice_nl_day_ahead_prices_api_data_available', 'on')
             and has_value('sensor.enerprice_nl_day_ahead_prices_current_market_price') }}
        state: >
          {{ states('sensor.enerprice_nl_day_ahead_prices_current_market_price') }}
        attributes:
          prices_today: >
            {{ state_attr('sensor.enerprice_nl_day_ahead_prices_current_market_price', 'prices_today')
               | default([], true) }}
          prices_tomorrow: >
            {{ state_attr('sensor.enerprice_nl_day_ahead_prices_current_market_price', 'prices_tomorrow')
               | default([], true) }}
          provider: >
            {{ state_attr('sensor.enerprice_nl_day_ahead_prices_current_market_price', 'provider') }}
          fallback_used: >
            {{ state_attr('sensor.enerprice_nl_day_ahead_prices_current_market_price', 'fallback_used') }}
          prijs_resolutie: >
            {{ state_attr('sensor.enerprice_nl_day_ahead_prices_current_market_price', 'raw_price_resolution') }}
          beschikbaar: "{{ is_state('binary_sensor.enerprice_nl_day_ahead_prices_api_data_available', 'on') and has_value('sensor.enerprice_nl_day_ahead_prices_current_market_price') }}"

      # ── BASISPRIJS: meerderheidsmediaan van ≥2 verse bronnen, anders falen
      - name: "Stroomprijs basis"
        unique_id: stroomprijs_basis
        unit_of_measurement: "EUR/kWh"
        state_class: measurement
        icon: mdi:currency-eur
        availability: >
          {% set n = [states('sensor.prijzen_bron_nordpool'),
                      states('sensor.prijzen_bron_enerprice'),
                      states('sensor.prijzen_bron_energyzero')]
                      | select('match', '^-?\\d') | map('float') | list %}
          {{ n | length >= 2 }}
        state: >
          {% set n = [states('sensor.prijzen_bron_nordpool'),
                      states('sensor.prijzen_bron_enerprice'),
                      states('sensor.prijzen_bron_energyzero')]
                      | select('match', '^-?\\d') | map('float') | list | sort %}
          {% if n | length == 0 %}none
          {% elif n | length == 1 %}{{ n[0] | round(6) }}
          {% elif n | length == 2 %}{{ ((n[0] + n[1]) / 2) | round(6) }}
          {% else %}{{ n[1] | round(6) }}{% endif %}
        attributes:
          bronnen_actief: >
            {% set ns = namespace(out=[]) %}
            {% for naam, eid in [('nordpool','sensor.prijzen_bron_nordpool'),
                                 ('enerprice','sensor.prijzen_bron_enerprice'),
                                 ('energyzero','sensor.prijzen_bron_energyzero')] %}
              {% if states(eid) is match('^-?\\d') %}{% set ns.out = ns.out + [naam] %}{% endif %}
            {% endfor %}
            {{ ns.out }}
          spreiding: >
            {% set n = [states('sensor.prijzen_bron_nordpool'),
                        states('sensor.prijzen_bron_enerprice'),
                        states('sensor.prijzen_bron_energyzero')]
                        | select('match', '^-?\\d') | map('float') | list %}
            {{ (n | max - n | min) | round(6) if n | length >= 2 else none }}

  # ── Binaire bewaking: is de minderheidscontrole nog OK? ──
  - binary_sensor:
      - name: "Prijzen kruiscontrole afwijking"
        unique_id: prijzen_kruiscontrole_afwijking
        delay_on: "00:05:00"
        delay_off: "00:05:00"
        state: >
          {% set s = state_attr('sensor.stroomprijs_basis', 'spreiding') %}
          {{ s is not none and s | float(0) > states('input_number.prijs_afwijkingsdrempel') | float(0.005) }}

      - name: "Prijzen morgen beschikbaar"
        unique_id: prijzen_morgen_beschikbaar
        # v1.7.0: 'morgen' bevat per definitie alleen ECHTE prijzen (prognose
        # leeft in het aparte 'morgen_prognose'), dus here count>0 volstaat.
        # Herberekent automatisch zodra sensor.stroomprijs_daglijst verandert
        # (state-attr-referentie in de template).
        state: >
          {% set m = state_attr('sensor.stroomprijs_daglijst', 'morgen')
                     | default([], true) %}
          {{ m | count > 0 }}

  # ── EnergyZero: corrigeert de uurprijs naar excl-btw (v1.5.4, review okt '26) ──
  #    GEEN triggers-blok meer: een state-based template-sensor volgt LIVE elke
  #    entiteit die zijn state/availability-template leest. Het oude gecoördi-
  #    neerde blok rendert alleen bij start of btw-wijziging → de sensor bevroor
  #    op de opstartwaarde en zag prijswijziging noch uitval.
  #    Deler is de CONSTANT 1.21: EnergyZero-levert wettelijk altijd incl. 21%
  #    btw; de contract-helper mag deze deler niet veranderen (met prijs_btw=0
  #    ontstond een valse kruiscontrole-afwijking tegen NordPool/EnerPrice).
  - sensor:
      - name: "Prijzen bron Energyzero"
        unique_id: prijzen_bron_energyzero
        unit_of_measurement: "EUR/kWh"
        state_class: measurement
        availability: "{{ has_value('sensor.energyzero_today_energy_current_hour_price') }}"
        state: >
          {{ (states('sensor.energyzero_today_energy_current_hour_price') | float(0)
              / 1.21) | round(6) }}
        attributes:
          interval_min: 60   # EnergyZero-core-sensor is per uur; NordPool/EnerPrice leveren straks 15 min
          beschikbaar: "{{ has_value('sensor.energyzero_today_energy_current_hour_price') }}"
          prices_today: "{{ [] }}"
          prices_tomorrow: "{{ [] }}"

  # ── TARIEF-2028 HELPER (v1.5.9): nettarief per TIJDSBLOK (ACM-codewijziging
  #    BR-2026-2242, bijlage 5: 5 blokken/dag per seizoen, factoren 0,0–1,0).
  #    Bron van de factoren = input_text.prijs_net_blokken:
  #      'Z|0-3:0,5;3-10:0,3;...'  — Zomer en/of Winter, gescheiden puntkomma's;
  #      komma = decimaalteken (Jan-tikvast); lege startnaam = beide seizoenen.
  #    Voorbeeld = ONTWERPBESLUIT ACM 8-10-2026 (ACM/UIT/683604), bijlage 5,
  #    tabel 'Toepassing wegingsfactoren' — alle 24 rijen × 12 maanden bewezen
  #    geparset (script: roi-monitor/acm_parse.py; rij N = periode N:00–N+1:00).
  #    [start,eind)-blokken. Inwerkingtreding beoogd 1-1-2029; definitief
  #    besluit verwacht eind 2026 — vóór die tijd is dit nog ONTWERP, dus ts
  #    (prijs_opslag_tijdsafhankelijk) blijft 0 en doet dit model pas mee.
  #      W|0-1:0,65;1-15:0,48;15-17:0,65;17-22:1,0;22-24:0,65
  #      Z|0-3:0,48;3-10:0,31;10-17:0,0;17-19:0,31;19-24:0,65
  #    Seizoenskeuze: april t/m september = zomer, anders winter.
  #    Veld leeg ONDANKS ts>0 → unavailable + notificatie (regel 1: nooit
  #    rekenen met onvolledige data — hier valt níét terug op 0).
  #    Leeg veld én ts=0 → 0 (contract nog niet zover). Zonder bloktekst
  #    werkt het oude dal/top-model (prijs_dal_uren/prijs_top_uren) door.
  - sensor:
      - name: "Energyprijs opslag toeslag"
        unique_id: energyprijs_opslag_toeslag
        unit_of_measurement: "EUR/kWh"
        state_class: measurement
        availability: >-
          {% set ts = states('input_number.prijs_opslag_tijdsafhankelijk') | float(0) %}
          {% set txt = states('input_text.prijs_net_blokken') | default('', true) | trim %}
          {{ has_value('sensor.stroomprijs_basis') and (ts <= 0 or txt != '') }}
        state: >-
          {% set ts = states('input_number.prijs_opslag_tijdsafhankelijk') | float(0) %}
          {% set txt = states('input_text.prijs_net_blokken') | default('', true) | trim %}
          {% set u = now().astimezone().hour %}
          {% set m = now().astimezone().month %}
          {% set ns = namespace(f=None) %}
          {% if txt != '' %}
            {% for mm in txt | regex_findall('([WZ])?\|?(\d{1,2})\s*-\s*(\d{1,2})\s*:\s*(\d+(?:[.,]\d+)?)') %}
              {% set naam = (mm[0] | upper) if mm[0] else '' %}
              {% set ss = mm[1] | int(-1) %}
              {% set ee = mm[2] | int(-1) %}
              {% set fc = mm[3] | replace(',', '.') | float(-1) %}
              {% set ok_seis = (naam == '') or (naam == 'Z' and 4 <= m <= 9) or (naam == 'W' and not (4 <= m <= 9)) %}
              {% if ok_seis and ss >= 0 and ee >= 0 and fc >= 0 and (ss <= u < ee or (ee <= ss and (u >= ss or u < ee))) %}
                {% set ns.f = fc %}
              {% endif %}
            {% endfor %}
          {% endif %}
          {% if ns.f is none and txt == '' %}
            {% set dal = states('input_number.prijs_dal_uren') | int(7) %}
            {% set top = states('input_number.prijs_top_uren') | int(17) %}
            {% set ns.f = 1.0 if (u < dal or u >= top) else 0.0 %}
          {% endif %}
          {% if ts <= 0 %}
            {{ 0 }}
          {% elif txt != '' and ns.f is none %}
            {{ none }}
          {% elif txt == '' %}
            {{ (ts * ns.f) | round(4) if ns.f is not none else none }}
          {% else %}
            {{ (ts * ns.f) | round(4) }}
          {% endif %}

  # ── GECOÖRDINEERD: daglijst herberekent live bij elke contractwijziging ──
  #    (state-based template-sensoren luisteren normaal NIET naar input_*;
  #     dit blok doet dat wél, zodat de rode verkoopreeks direct meeloopt.)
  #    v1.5.3 — eerste-beschikbare-bron + verifiëren:
  #    1. BRON = eerste bron (vaste volgorde EnerPrice → Nord Pool →
  #       EnergyZero) met een LEVENDE daglijst. De eerste die iets heeft
  #       levert de daglijst; de andere bronnen worden daarna gecontroleerd
  #       op overinstemming (max. afwijking tussen de drie) via
  #       binary_sensor.prijzen_morgen_spreiding en de 15:15-melding.
  #       Vóór v1.5.3 las de daglijst ALLEEN van EnerPrice — als die om 23:00
  #       de D+1-prijzen nog niet had, bleef 'morgen' leeg terwijl de
  #       prijzen al bekend waren (Jan, 10 okt '26).
  #    2. De daglijst-sensor zelf heeft GEEN availability-afhankelijkheid op
  #       één bron: zolang er ÉÉN daglijst is, staat de sensor.
  - triggers:
      - trigger: homeassistant
        event: start
      # Elke 5 min een verse state (now().strftime('%H:%M')) → de kaart (zonder
      # update_interval) ververst dan ook vanzelf: 'nu'-markering blijft lopen en
      # een gemiste prijzendruppel pakt hij binnen 5 min op (review 7 okt '26).
      - trigger: time_pattern
        minutes: "/5"
      - trigger: state
        entity_id:
          - input_number.prijs_btw
          - input_number.prijs_energiebelasting
          - input_number.prijs_opslag_afname
          - input_number.prijs_opslag_levering
          - input_number.prijs_laad_fractie
          - input_boolean.prijs_saldering_energiebelasting_teruggave
          - sensor.prijzen_bron_enerprice
          - sensor.prijzen_bron_voorspelling
    sensor:
      # ── DAGLIJST voor ApexCharts: [{t, p}] bruto, vandaag + morgen.
      - name: "Stroomprijs daglijst"
        unique_id: stroomprijs_daglijst
        state: >
          {{ now().strftime('%H:%M') }}
        attributes:
          # v1.5.3: eerste bron (vaste volgorde) met een levende daglijst.
          # v1.7.0: voorspelling telt NIET mee voor 'bron' — die blijft leeg in
          # het EPEX-gat; de grijze reeks leeft in het aparte attribuut
          # 'morgen_prognose', dus 'morgen' (en alle lezers daarvan) blijft
          # puur op echte prijzen.
          bron: >
            {% set b = namespace(x='') %}
            {% for naam, eid in [('enerprice','sensor.prijzen_bron_enerprice'),
                                 ('nordpool','sensor.prijzen_bron_nordpool'),
                                 ('energyzero','sensor.prijzen_bron_energyzero')] %}
              {% if b.x == '' and state_attr(eid, 'prices_today') | default([], true) | count > 0 %}{% set b.x = naam %}{% endif %}
            {% endfor %}
            {{ b.x }}
          vandaag: >
            {% set btw = 1 + states('input_number.prijs_btw') | float(0.21) %}
            {% set bel = states('input_number.prijs_energiebelasting') | float(0) %}
            {% set sa = states('input_number.prijs_opslag_afname') | float(0) %}
            {% set sl = states('input_number.prijs_opslag_levering') | float(0) %}
            {% set saldering = states('input_boolean.prijs_saldering_energiebelasting_teruggave') == 'on' %}
            {% set ns = namespace(out=[], eid='') %}
            {% for naam, eid in [('enerprice','sensor.prijzen_bron_enerprice'),
                                 ('nordpool','sensor.prijzen_bron_nordpool'),
                                 ('energyzero','sensor.prijzen_bron_energyzero')] %}
              {% if ns.eid == '' and state_attr(eid, 'prices_today') | default([], true) | count > 0 %}{% set ns.eid = eid %}{% endif %}
            {% endfor %}
            {# v1.8.1: bron voOR de voorloop-scan van de minimumbepaling — morgenvoorsprong
               (echte morgenprijzen; anders de prognose-bron) zodat een laag blok straks
               nachts al meetelt in de fractiegrens. #}
            {% set ns.eid_tm = '' %}
            {% for naam, eid in [('enerprice','sensor.prijzen_bron_enerprice'),
                                 ('nordpool','sensor.prijzen_bron_nordpool'),
                                 ('energyzero','sensor.prijzen_bron_energyzero')] %}
              {% if ns.eid_tm == '' and state_attr(eid, 'prices_tomorrow') | default([], true) | count > 0 %}{% set ns.eid_tm = eid %}{% endif %}
            {% endfor %}
            {% if ns.eid_tm == '' %}{% set ns.eid_tm = 'sensor.prijzen_bron_voorspelling' %}{% endif %}
            {# v1.8.1: accumulators voor het vooruitkijkend minimum (zie scan hieronder) #}
            {% set ns_mn = namespace(wm=9.0, tm=9.0, tmin=None) %}
            {% for i in state_attr(ns.eid_tm, 'prices_tomorrow') | default([], true) %}
              {% if i.time is defined and i.price is defined %}
                {% set dtx = (i.time | as_datetime).astimezone() %}
                {% if ns_mn.tmin is none or dtx < ns_mn.tmin %}{% set ns_mn.tmin = dtx %}{% endif %}
              {% endif %}
            {% endfor %}
            {% set ts = states('input_number.prijs_opslag_tijdsafhankelijk') | float(0) %}
            {% set dal_u = states('input_number.prijs_dal_uren') | int(7) %}
            {% set top_u = states('input_number.prijs_top_uren') | int(17) %}
            {% set ftext = states('input_text.prijs_net_blokken') | default('', true) | trim %}
            {% set rt = states('input_number.rendement_roundtrip_pct') | float(70) / 100 %}
            {# v1.6.2: guard tegen deling door 0 (eerste start: helpers even 0) #}
            {% set rt_safe = [rt, 0.01] | max %}
            {# v1.8.1: laagste all-in over álle beschikbare vandaag-kwartieren in ns_mn.wm.
               Doel: laden = goedkoopste uren van het ROLLENDE venster; álle kwartieren
               tellen mee, niet alleen het huidige. Zelfde formule als hoofd-lus hieronder. #}
            {% for x0 in state_attr(ns.eid, 'prices_today') | default([], true) %}
              {% if x0.time is defined and x0.price is defined %}
                {% set h0 = (x0.time | as_datetime).astimezone().hour %}
                {% set mnd0 = (x0.time | as_datetime).astimezone().month %}
                {% set nsb0 = namespace(f=None) %}
                {% if ftext != '' %}
                  {% for mm in ftext | regex_findall('([WZ])?\|?(\d{1,2})\s*-\s*(\d{1,2})\s*:\s*(\d+(?:[.,]\d+)?)') %}
                    {% set naam = (mm[0] | upper) if mm[0] else '' %}
                    {% set ss = mm[1] | int(-1) %}
                    {% set ee = mm[2] | int(-1) %}
                    {% set fc = mm[3] | replace(',', '.') | float(-1) %}
                    {% set ok_seis = (naam == '') or (naam == 'Z' and 4 <= mnd0 <= 9) or (naam == 'W' and not (4 <= mnd0 <= 9)) %}
                    {% if ok_seis and ss >= 0 and ee >= 0 and fc >= 0 and (ss <= h0 < ee or (ee <= ss and (h0 >= ss or h0 < ee))) %}
                      {% set nsb0.f = fc %}
                    {% endif %}
                  {% endfor %}
                {% else %}
                  {% set nsb0.f = 1.0 if (h0 < dal_u or h0 >= top_u) else 0.0 %}
                {% endif %}
                {% set toel0 = (ts * nsb0.f) if (ts > 0 and nsb0.f is not none) else 0 %}
                {% set a0 = ((x0.price | float(0) + sa + toel0 + bel) * btw) | round(4) %}
                {% if a0 < ns_mn.wm %}{% set ns_mn.wm = a0 %}{% endif %}
              {% endif %}
            {% endfor %}
            {% for i in state_attr(ns.eid, 'prices_today') | default([], true) %}
              {% if i.time is defined and i.price is defined %}
                {% set p = i.price | float(0) %}
                {# ── tariefcontract 2028: toeslag per lokaal uur; vóór 1-1-2028
                   is ts=0 en valt alles terug op de vaste contract-opslagen ── #}
                {% set h = (i.time | as_datetime).astimezone().hour %}
                {# rt = in/η en rt_uit = uit×η: wat de kWh werkelijk kost/oplevert na
                   omzettingsverlies (rendement-contract); handelen loont pas boven spread/η #}
                {% set mnd = (i.time | as_datetime).astimezone().month %}
