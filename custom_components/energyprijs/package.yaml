    unit_of_measurement: "kW"
    min: 0
    max: 100
    step: 0.1
    mode: box
    icon: mdi:current-dc
  accu_reserve_pct:
    # RESERVE-CONTRACT (v1.4.0): de SOC-ondergrens die het systeem NOOIT mag
    # underschrijden — netstoring-overbrugging + cel-beveiliging. Alles erboven
    # is vrij speelgeld van de solver/handelslogica. Eén bron van waarheid
    # (herontwerp les §5.5): formules en automatiseringen lezen deze helper,
    # nooit een hardcoded 20%. Bewust géén 'initial': HA herstelt de laatste
    # gebruikerswaarde; de installer zet éénmalig de default (zie HELPERS_DEFAULTS).
    name: "Accu: reserve (%, ondergrens SOC)"
    unit_of_measurement: "%"
    min: 0
    max: 100
    step: 1
    mode: box
    icon: mdi:battery-alert-variant-outline
  # ── RENDEMENT-CONTRACT (v1.5.5): gemeten omzettingsrendementen uit eigen HA-data
  #    (accu_verlies_meten.py, periode aug→okt '26; AC-zijde = P1 + Deye load).
  #    Eén bron van waarheid: formules en shadow lezen deze helpers, geen
  #    hardcoded η. Startwaarden via HELPERS_DEFAULTS (installer.py).
  rendement_laad_pct:
    name: "Rendement: laden net→cel (%)"
    unit_of_measurement: "%"
    min: 0
    max: 100
    step: 0.5
    mode: box
