install:
  name: "Package installeren"
  description: >
    Schrijft het energyprijs-package naar /config/packages en controleert de
    packages-include in configuration.yaml — die wordt NOOIT automatisch
    herschreven; bij een ontbrekende regel krijg je de exact te plakken regels.
    Herstart daarna HA (tenzij force_restart: true).
  fields:
    force_restart:
      name: "Herstart forceren"
      description: "Start HA direct opnieuw na wijzigingen (meestal niet nodig)."
      selector:
        boolean:

status:
  name: "Installatiestatus"
  description: >
    Controleert of het package en de include aanwezig zijn. Antwoord via response_payload.

cards:
  name: "Dashboardkaarten ophalen"
  description: >
    Geeft de kant-en-klare YAML voor de dynamische energie-grafiek en de
    contractinvulvelden-kaart terug (response_payload). Plakken via Add card →
    Show code editor; vereist HACS-kaart apexcharts-card.
  response:
dashboard:
  name: "Energie-dashboard aanmaken/bijwerken"
  description: >
    Maakt het user-dashboard "Energie — stroomprijs" aan met de grafiek- en
    contractkaarten, of werkt alleen de gemarkeerde energyprijs-blokken bij
    naar de laatste versie. Andere kaarten in het dashboard blijven intact.
    Antwoord via response_payload.
  response:
