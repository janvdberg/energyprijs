# Golden file — exact het dashboard dat Jan handmatig opbouwde (4 okt '26).
# De integratie MOET dit genereren; zie tests/test_golden_dashboard.py.
# energyprijs_versie is de marker die de code zelf zet (volgt de manifestversie).
views:
  - title: Energie
    path: energie
    cards:
      - square: false
        type: grid
        cards:
          - type: entity
            entity: sensor.stroomprijs_afname
            name: Inkoopprijs
            icon: mdi:arrow-bottom-right
            state_color: true
          - type: entity
            entity: sensor.stroomprijs_levering
            name: Verkoopprijs
            icon: mdi:arrow-top-right
        columns: 2
      - type: custom:apexcharts-card
        section_mode: true
        experimental:
          color_threshold: true
          disable_config_validation: true
        graph_span: 24h
        span:
          start: day
        update_interval: 5min
        show:
          last_updated: true
        now:
          show: true
          label: nu
        header:
          show: true
          title: Stroomprijs
          show_states: false
          colorize_states: false
        series:
          - entity: sensor.stroomprijs_daglijst
            name: bruto
            type: column
            data_generator: >-
              return entity.attributes.vandaag.map((e) => [new
              Date(e.t).getTime() + 450000, e.p]);
            float_precision: 3
            color_threshold:
              - value: 0
                color: '#0a8f3c'
              - value: 0.1
                color: '#2fbf5f'
              - value: 0.25
                color: '#e6b800'
              - value: 0.4
                color: '#d94040'
            show:
              in_header: false
        apex_config:
          legend:
            show: false
          xaxis:
            min: EVAL:new Date(new Date().setHours(0,0,0,0)).getTime() - 450000
            max: >-
              EVAL:new Date(new Date().setHours(23,59,59,999)).getTime() +
              450000
        yaxis:
          - decimals: 3
            min: '|-0.04|'
            max: '|+0.04|'
      - type: entities
        title: Stroomprijs — contractinstellingen
        show_header_toggle: false
        state_color: true
        entities:
          - entity: input_number.prijs_btw
            name: Btw (factor, NL = 0,21)
          - entity: input_number.prijs_energiebelasting
            name: Energiebelasting excl. btw (€/kWh)
          - entity: input_number.prijs_opslag_afname
            name: Leveranciersopslag afname (€/kWh)
          - entity: input_number.prijs_opslag_levering
            name: Leveranciersopslag levering (€/kWh)
          - entity: input_boolean.prijs_saldering_energiebelasting_teruggave
            name: Saldering (teruggave belasting)
